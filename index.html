<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="nav">
        <div class="logo">
            <p>SkyScan</p>
        </div>
        <div class="searchAndScan">
            <i class="fa-solid fa-magnifying-glass" style="font-size: 15px;"></i>
            <input type="text" placeholder="Search" class="navSearch">
            <i class="fa-solid fa-bars" style="font-size: 25px;"></i>
        </div>
    </div>

    <div class="main">
        <h1 class="heading">Search For The Weather In Every City You Go</h1>
        <input type="text" placeholder="Search For A City" class="cityInp">
        <div class="sub">

            <!-- From Uiverse.io by Peary74 -->
            <button class="submit">
                <div class="svg-wrapper-1">
                    <div class="svg-wrapper">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30" class="icon">
                            <path
                                d="M22,15.04C22,17.23 20.24,19 18.07,19H5.93C3.76,19 2,17.23 2,15.04C2,13.07 3.43,11.44 5.31,11.14C5.28,11 5.27,10.86 5.27,10.71C5.27,9.33 6.38,8.2 7.76,8.2C8.37,8.2 8.94,8.43 9.37,8.8C10.14,7.05 11.13,5.44 13.91,5.44C17.28,5.44 18.87,8.06 18.87,10.83C18.87,10.94 18.87,11.06 18.86,11.17C20.65,11.54 22,13.13 22,15.04Z">
                            </path>
                        </svg>
                    </div>
                </div>
                <span>Search</span>
            </button>


        </div>
        <div class="result"></div>
    </div>

</body>
<script src="script.js"></script>

</html>
